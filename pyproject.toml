[project]
name = "lang-chain-hello-world-chain"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Javed Mujawar", email =  "mujawar.javadu@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "black>=26.5.1",
    "isort>=9.0.1",
    "langchain>=1.4.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.2",
    "ollama>=0.6.2",
    "python-dotenv>=1.2.3",
]

[project.scripts]
lang-chain-hello-world-chain = "lang_chain_hello_world_chain:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
